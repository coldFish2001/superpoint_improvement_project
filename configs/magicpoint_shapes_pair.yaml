# 数据配置部分
data:
#    name: 'synthetic_shapes'  # 数据集名称（已注释）
    dataset: 'SyntheticDataset_gaussian'  # 使用的数据集类名
    primitives: 'all'  # 使用所有基础形状
    truncate: {draw_ellipses: 0.3, draw_stripes: 0.2, gaussian_noise: 0.1}  # 形状生成参数
    cache_in_memory: true  # 是否在内存中缓存数据
    suffix: 'v6'  # 数据集版本后缀
    add_augmentation_to_test_set: false  # 测试集是否添加增强（默认为false）
    gaussian_label:
        enable: false  # 是否启用高斯标签
        params:
            GaussianBlur: {sigma: 0.2}  # 高斯模糊参数
    preprocessing:  # 预处理配置
        blur_size: 21  # 模糊核大小
        resize: [120, 160]  # 图像调整大小
    augmentation:  # 数据增强配置
        photometric:  # 光度增强
            enable: true  # 是否启用
            enable_train: true  # 训练集是否启用
            enable_val: false  # 验证集是否启用
            primitives: [  # 增强方法列表
                'random_brightness', 'random_contrast', 'additive_speckle_noise',
                'additive_gaussian_noise', 'additive_shade', 'motion_blur' ]
            params:  # 增强参数
                random_brightness: {max_abs_change: 75}  # 随机亮度调整范围
                random_contrast: {strength_range: [0.3, 1.8]}  # 随机对比度调整范围
                additive_gaussian_noise: {stddev_range: [0, 15]}  # 高斯噪声范围
                additive_speckle_noise: {prob_range: [0, 0.0035]}  # 斑点噪声概率
                additive_shade:  # 阴影增强
                    transparency_range: [-0.5, 0.8]  # 透明度范围
                    kernel_size_range: [50, 100]  # 核大小范围
                motion_blur: {max_kernel_size: 7}  # 运动模糊核大小
        homographic:  # 单应性增强
            enable: true  # 是否启用
            enable_train: true  # 训练集是否启用
            enable_val: false  # 验证集是否启用
            params:  # 单应性参数
                translation: true  # 是否启用平移
                rotation: true  # 是否启用旋转
                scaling: true  # 是否启用缩放
                perspective: true  # 是否启用透视变换
                scaling_amplitude: 0.2  # 缩放幅度
                perspective_amplitude_x: 0.2  # X轴透视幅度
                perspective_amplitude_y: 0.2  # Y轴透视幅度
                patch_ratio: 0.8  # 补丁比例
                max_angle: 1.57  # 最大旋转角度（弧度）
                allow_artifacts: true  # 是否允许伪影
                translation_overflow: 0.05  # 平移溢出范围
            valid_border_margin: 2  # 有效边界边距
    warped_pair:  # 扭曲对配置
        enable: false  # 是否启用（默认为false）
        params:  # 扭曲对参数
            translation: true  # 是否启用平移
            rotation: true  # 是否启用旋转
            scaling: true  # 是否启用缩放
            perspective: true  # 是否启用透视变换
            scaling_amplitude: 0.2  # 缩放幅度
            perspective_amplitude_x: 0.2  # X轴透视幅度
            perspective_amplitude_y: 0.2  # Y轴透视幅度
            patch_ratio: 0.85  # 补丁比例
            max_angle: 1.57  # 最大旋转角度（弧度）
            allow_artifacts: true  # 是否允许伪影
        valid_border_margin: 3  # 有效边界边距

# 前端模型配置
front_end_model: 'Train_model_heatmap'  # 前端模型名称

# 模型配置
model:
    name: 'SuperPointNet_gauss2'  # 模型名称
    params: {}  # 模型参数（空）
    detector_loss:
        loss_type: 'softmax'  # 检测器损失类型

    batch_size: 48  # 训练批次大小
    eval_batch_size: 16  # 评估批次大小
    learning_rate: 0.001  # 学习率
    kernel_reg: 0.  # 核正则化参数
    detection_threshold: 0.001  # 检测阈值
    nms: 4  # 非极大值抑制窗口大小
    lambda_loss: 0  # 描述符损失权重（禁用）
    dense_loss:  # 密集损失配置
        enable: false  # 是否启用
        params:
            descriptor_dist: 4  # 描述符距离阈值
            lambda_d: 800  # 密集损失权重
    sparse_loss:  # 稀疏损失配置
        enable: true  # 是否启用
        params:
            num_matching_attempts: 1000  # 匹配尝试次数
            num_masked_non_matches_per_match: 100  # 每个匹配的非匹配数量
            lamda_d: 1  # 稀疏损失权重
            dist: 'cos'  # 距离度量方法
            method: '2d'  # 匹配方法
    other_settings: 'train 2d, gauss 0.5'  # 其他设置

# 训练配置
retrain: True  # 是否重新训练
reset_iter: True  # 是否重置迭代次数

train_iter: 200000  # 训练迭代次数
tensorboard_interval: 1000  # TensorBoard日志间隔
save_interval: 2000  # 模型保存间隔
validation_interval: 1000  # 验证间隔
validation_size: 10  # 验证集大小
train_show_interval: 1000  # 训练展示间隔
seed: 0  # 随机种子

# 预训练模型路径（已注释）
# pretrained: 'logs/superpoint_syn_heat1_0/checkpoints/superPointNet_100000_checkpoint.pth.tar'