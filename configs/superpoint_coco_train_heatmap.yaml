data:
    # name: 'coco'
    dataset: 'Coco' # 'coco'

    #labels: my_files/logs/1011_exportingDetection_coco2014/predictions #步骤2生成的伪标签路径
    labels: '../../my_files/logs/1011_exportingDetection_coco2014/predictions'
    #root: my_files/datasets/COCO #数据集路径
    root: '../../my_files/datasets/COCO' #主要使用
    #root: '/media/coldfish/SN530/BAG数据与双目数据/publicData_coco/COCO' #临时使用
    root_split_txt: # /datasets/COCO

    gaussian_label:
        enable: true
        params:
            GaussianBlur: {sigma: 0.2}


    cache_in_memory: false
    preprocessing:
        resize: [480, 640]
        # resize: [480, 640]
    augmentation:
        photometric:
            enable: true
            primitives: [
                'random_brightness', 'random_contrast', 'additive_speckle_noise',
                'additive_gaussian_noise', 'additive_shade', 'motion_blur']
            params:
                random_brightness: {max_abs_change: 50}
                random_contrast: {strength_range: [0.5, 1.5]}
                additive_gaussian_noise: {stddev_range: [0, 10]}
                additive_speckle_noise: {prob_range: [0, 0.0035]}
                additive_shade:
                    transparency_range: [-0.5, 0.5]
                    kernel_size_range: [100, 150]
                motion_blur: {max_kernel_size: 3}
        homographic:
            enable: true  # not implemented
    warped_pair:
        enable: true
        params:
            translation: true
            rotation: true
            scaling: true
            perspective: true
            scaling_amplitude: 0.15 #0.2
            perspective_amplitude_x: 0.15 #0.2
            perspective_amplitude_y: 0.15 #0.2
            patch_ratio: 0.85
            max_angle: 1.57
            allow_artifacts: true # true
        valid_border_margin: 3

front_end_model: 'Train_model_heatmap'  # 'Train_model_frontend'

training:
    workers_train: 8 # 16
    workers_val: 2 # 2

model:
    # name: 'magic_point'
    # name: 'SuperPointNet_heatmap'
    name: 'SuperPointNet_gauss2'
    params: {
    }
    detector_loss:
        loss_type: 'softmax'


    batch_size: 4 # 32
    eval_batch_size: 4 # 32
    learning_rate: 0.000001 # 0.0001
    detection_threshold: 0.015 # 0.015
    lambda_loss: 1 # 1
    nms: 4
    dense_loss:
        enable: false #是否使用密集损失
        params:
            descriptor_dist: 4 # 4, 7.5
            lambda_d: 800 # 800
    sparse_loss:
        enable: true #是否使用稀疏损失
        params:
            num_matching_attempts: 1000
            num_masked_non_matches_per_match: 100
            lamda_d: 10 #1 稀疏描述子损失权重（在加载了预训练模型之后，该权重被设置成了50（或者说一开始设置为50））
            dist: 'cos'
            method: '2d'
    other_settings: 'train 2d, gauss 0.2'
    # subpixel:
        # enable: false
        # params:
        #     subpixel_channel: 2
        # settings: 'predict flow directly'
        # loss_func: 'subpixel_loss_no_argmax' # subpixel_loss, subpixel_loss_no_argmax

retrain: False # set true for new model 如果为false，则会获取预训练文件
reset_iter: False # set true to set the iteration number to 0
train_iter: 50000 # 170000
validation_interval: 500 # 200 
tensorboard_interval: 500 # 200：控制训练日志和可视化数据写入 TensorBoard 的频率
save_interval: 500 # 2000
validation_size: 10

#预训练模型地址（如果使用预训练模型，则需要把retrain参数设置为false）
#pretrained: logs/superpoint_coco_heat2_0/checkpoints/superPointNet_170000_checkpoint.pth.tar
pretrained: ../../my_files/logs/1121_superpointCBAM_coco2014/checkpoints/superPointNet_28000_checkpoint.pth.tar




